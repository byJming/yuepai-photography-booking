# Nginx 配置示例路径：/etc/nginx/conf.d/example-app.conf
limit_req_zone $binary_remote_addr zone=yuepai_public_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yuepai_admin_api:10m rate=5r/s;

server {
    listen 80;
    server_name your-domain.example;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/java_node_ssl;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate /www/server/panel/vhost/cert/yuepai/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/yuepai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:YuepaiTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /www/wwwlogs/yuepai.log;
    error_log /www/wwwlogs/yuepai.error.log warn;

    server_tokens off;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;

    location = /health/live {
        proxy_pass http://127.0.0.1:8100/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8100/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /api/admin/v1/media {
        client_max_body_size 16m;
        limit_req zone=yuepai_admin_api burst=2 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ^~ /api/admin/ {
        client_max_body_size 512k;
        limit_req zone=yuepai_admin_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_hide_header Server;
    }

    location ^~ /api/ {
        client_max_body_size 512k;
        limit_req zone=yuepai_public_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_hide_header Server;
    }

    location ^~ /media/public/ {
        alias /srv/example-app/media/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        access_log off;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        alias /srv/example-app/admin-web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
    }

    location ^~ /admin/ {
        alias /srv/example-app/admin-web/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
