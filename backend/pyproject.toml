[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yuepai-backend"
version = "0.1.0"
description = "个人摄影预约小程序后端"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23,<26",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyMySQL>=1.1,<2",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.30,<3",
  "httpx2>=2.7,<3",
  "mypy>=1.14,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
yuepai-create-admin = "app.cli.create_admin:main"
yuepai-retention-cleanup = "app.cli.retention_cleanup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.coverage.run]
source = ["app"]
branch = true
